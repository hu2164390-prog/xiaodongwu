<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>今日小动物 · 每天认识一点今天的自己</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Ma+Shan+Zheng&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F3;
  --paper-2:#F4EFE6;
  --ink:#241F1A;
  --ink-2:#5A524A;
  --ink-3:#9A9186;
  --ink-4:#C4BCB0;
  --line:#E9E2D6;
  --terracotta:#C77B58;
  --terracotta-deep:#A85F3E;
  --sage:#8A9A7B;
  --cream:#F4E8D0;
  --rose:#E8C4BC;
  --sky:#B8CDD9;

  --font-serif:'Noto Serif SC','Songti SC',serif;
  --font-hand:'Ma Shan Zheng',cursive;
  --font-sans:'Zen Maru Gothic','Hiragino Sans',system-ui,sans-serif;

  --ease:cubic-bezier(.22,.9,.28,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}

body{
  background:linear-gradient(135deg,#FFF6EC 0%,#FFEFE4 25%,#F0F6EC 50%,#EAF2F8 75%,#F8EEF5 100%);
  background-size:400% 400%;
  animation:bgFlow 25s ease infinite;
  color:var(--ink);
  font-family:var(--font-serif);
  font-weight:400;
  line-height:1.75;
  letter-spacing:.02em;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 20px 40px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

@keyframes bgFlow{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

body::before{
  content:'';
  position:fixed;inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 15% 20%, rgba(255,200,180,.35), transparent 60%),
    radial-gradient(ellipse 45% 45% at 85% 30%, rgba(255,230,160,.4), transparent 60%),
    radial-gradient(ellipse 55% 40% at 30% 85%, rgba(200,230,200,.35), transparent 60%),
    radial-gradient(ellipse 50% 45% at 80% 80%, rgba(190,215,240,.35), transparent 60%),
    radial-gradient(ellipse 45% 40% at 50% 50%, rgba(230,200,230,.25), transparent 60%);
  animation:blob 18s ease-in-out infinite;
}
@keyframes blob{
  0%,100%{transform:scale(1) rotate(0deg);opacity:.9}
  33%{transform:scale(1.08) rotate(2deg);opacity:1}
  66%{transform:scale(0.98) rotate(-2deg);opacity:.85}
}

body::after{
  content:'';
  position:fixed;inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.25;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 .06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.bubble{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:1;
  opacity:0;
  animation:bubbleUp linear infinite;
  filter:blur(.5px);
}
@keyframes bubbleUp{
  0%{transform:translateY(100vh) scale(.4);opacity:0}
  10%{opacity:.55}
  90%{opacity:.55}
  100%{transform:translateY(-15vh) scale(1.1);opacity:0}
}

.animal-float{
  position:fixed;
  pointer-events:none;
  z-index:1;
  opacity:.13;
  animation:animalDrift 22s ease-in-out infinite;
}
@keyframes animalDrift{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(30px,-20px) rotate(3deg)}
  50%{transform:translate(-15px,25px) rotate(-2deg)}
  75%{transform:translate(20px,15px) rotate(1deg)}
}

.petal{
  position:fixed;
  pointer-events:none;
  z-index:1;
  opacity:0;
  animation:petalFall linear infinite;
}
@keyframes petalFall{
  0%{transform:translateY(-40px) translateX(0) rotate(0deg);opacity:0}
  10%{opacity:.6}
  90%{opacity:.6}
  100%{transform:translateY(105vh) translateX(40px) rotate(360deg);opacity:0}
}

.app{
  width:100%;
  max-width:440px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:0;
}

.card{
  background:rgba(255,254,251,.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-radius:24px;
  padding:28px 22px 32px;
  position:relative;
  animation:pageIn .7s var(--ease-out);
  box-shadow:
    0 24px 60px rgba(220,180,150,.18),
    0 8px 24px rgba(200,170,140,.12),
    0 0 0 1px rgba(255,255,255,.6) inset;
  border:1px solid rgba(255,240,230,.9);
  width:100%;
}

.card::before{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:24px;
  padding:1px;
  background:linear-gradient(135deg, rgba(255,200,180,.5), rgba(255,230,160,.5), rgba(200,230,200,.5), rgba(190,215,240,.5), rgba(230,200,230,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:.6;
  animation:cardGlow 8s ease-in-out infinite;
}
@keyframes cardGlow{
  0%,100%{opacity:.5}
  50%{opacity:.9}
}

@keyframes pageIn{
  from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(6px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

.q-anim-out{animation:qOut .28s var(--ease) forwards !important}
.q-anim-in{animation:qIn .42s var(--ease-out) forwards !important}
@keyframes qOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-12px)}
}
@keyframes qIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:44px;
  padding-top:4px;
}
.brand-mark{
  width:32px;height:32px;
  flex-shrink:0;
  animation:breathe 4s var(--ease-soft) infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
.brand-text{
  font-size:12px;
  letter-spacing:.4em;
  color:var(--ink-2);
  font-weight:500;
}
.brand-text small{
  display:block;
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.35em;
  color:var(--ink-3);
  margin-top:3px;
  font-weight:400;
}

.hero{padding:0 4px;text-align:center}

.hero-illus{
  width:100%;
  max-width:280px;
  margin:0 auto 36px;
  display:block;
  animation:illusIn 1.2s var(--ease-out);
}
@keyframes illusIn{
  from{opacity:0;transform:translateY(20px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.hero-eyebrow{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.5em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:20px;
}

.hero-title{
  font-size:30px;
  font-weight:500;
  line-height:1.55;
  letter-spacing:.08em;
  color:var(--ink);
  margin-bottom:18px;
}
.hero-title .hand{
  font-family:var(--font-hand);
  font-size:38px;
  color:var(--terracotta);
  display:inline-block;
  margin-top:6px;
}

.hero-sub{
  font-size:13px;
  color:var(--ink-2);
  line-height:2.1;
  letter-spacing:.1em;
  margin-bottom:36px;
}

.hero-actions{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
  width:100%;
}

.btn{
  font-family:var(--font-serif);
  font-size:14px;
  letter-spacing:.24em;
  font-weight:500;
  border:none;
  cursor:pointer;
  transition:all .5s var(--ease);
  background:transparent;
  color:var(--ink);
  padding:0;
  position:relative;
}

.btn-primary{
  background:linear-gradient(135deg, #2A2622, #3D3530);
  color:var(--paper);
  padding:18px 56px;
  border-radius:100px;
  min-width:250px;
  position:relative;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(36,31,26,.2);
}
.btn-primary::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,200,180,.35), transparent);
  transform:translateX(-100%);
  transition:transform .8s var(--ease);
}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:hover{
  background:linear-gradient(135deg, #C77B58, #E89A78);
  transform:translateY(-2px);
  box-shadow:0 18px 40px rgba(199,123,88,.4);
}
.btn-primary:active{transform:translateY(0) scale(.99)}

.btn-ghost{
  color:var(--ink-3);
  font-size:12px;
  letter-spacing:.28em;
  padding:10px 0;
  border-bottom:1px solid transparent;
}
.btn-ghost:hover{color:var(--ink);border-bottom-color:var(--ink-4)}

.progress{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:32px;
  padding-top:4px;
}
.progress-label{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.3em;
  color:var(--ink-3);
  min-width:52px;
  text-transform:uppercase;
}
.progress-track{
  flex:1;
  height:1px;
  background:var(--line);
  position:relative;
}
.progress-fill{
  position:absolute;left:0;top:0;
  height:1px;
  background:linear-gradient(90deg, var(--terracotta), #FFB88C, var(--terracotta-deep));
  background-size:200% 100%;
  width:0;
  transition:width .9s var(--ease-out);
  animation:energyFlow 3s linear infinite;
}
@keyframes energyFlow{
  0%{background-position:0% 50%}
  100%{background-position:200% 50%}
}
.progress-fill::after{
  content:'';
  position:absolute;
  right:0;top:-2.5px;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--terracotta);
  box-shadow:0 0 0 4px rgba(199,123,88,.25), 0 0 12px rgba(199,123,88,.5);
}
.progress-count{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.2em;
  color:var(--ink-3);
  min-width:52px;
  text-align:right;
}

.question{padding:0 4px}

.q-meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}
.q-meta-num{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.4em;
  color:var(--terracotta);
  font-weight:500;
  text-transform:uppercase;
}
.q-meta-line{
  flex:1;
  height:1px;
  background:var(--line);
}
.q-meta-hint{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.2em;
  color:var(--ink-3);
  transition:color .4s var(--ease);
}

.q-title{
  font-size:22px;
  font-weight:500;
  line-height:1.65;
  letter-spacing:.06em;
  color:var(--ink);
  margin-bottom:32px;
}

.opts{display:flex;flex-direction:column;gap:0}

.opt{
  display:flex;
  align-items:flex-start;
  gap:20px;
  padding:20px 8px;
  border-top:1px solid var(--line);
  cursor:pointer;
  transition:all .55s var(--ease);
  background:transparent;
  text-align:left;
  font-family:var(--font-serif);
  color:var(--ink);
  width:100%;
  position:relative;
  overflow:hidden;
}
.opt:last-child{border-bottom:1px solid var(--line)}

.opt::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background:var(--terracotta);
  transform:scaleY(0);
  transform-origin:top;
  transition:transform .5s var(--ease-out);
}
.opt:hover{padding-left:20px;background:linear-gradient(90deg, rgba(255,240,230,.6), transparent 70%)}
.opt:hover::before{transform:scaleY(1)}
.opt:hover .opt-mark{border-color:var(--terracotta);color:var(--terracotta);transform:scale(1.08)}

.opt.selected{
  padding-left:20px;
  background:linear-gradient(90deg, rgba(244,232,208,.85), transparent 70%);
}
.opt.selected::before{transform:scaleY(1)}
.opt.selected .opt-mark{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
  transform:rotate(360deg) scale(1.05);
}
.opt.selected .opt-text{color:var(--ink);font-weight:500}

.opt-mark{
  flex-shrink:0;
  width:26px;height:26px;
  border:1px solid var(--line);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-sans);
  font-size:11px;
  color:var(--ink-3);
  transition:all .6s var(--ease-spring);
  margin-top:1px;
}

.opt-text{
  flex:1;
  font-size:15px;
  line-height:1.75;
  color:var(--ink-2);
  transition:color .4s var(--ease);
}

.opt .ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(199,123,88,.25);
  transform:scale(0);
  animation:ripple .9s var(--ease-out) forwards;
  pointer-events:none;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid var(--line);
}
.nav-btn{
  font-family:var(--font-sans);
  font-size:11px;
  letter-spacing:.24em;
  color:var(--ink-3);
  background:rgba(255,255,255,.6);
  border:1px solid var(--line);
  border-radius:100px;
  cursor:pointer;
  padding:12px 22px;
  min-height:44px;
  transition:all .4s var(--ease);
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
.nav-btn:hover:not(:disabled){
  color:var(--ink);
  border-color:var(--ink);
  background:rgba(255,255,255,.95);
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(36,31,26,.08);
}
.nav-btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-btn.primary{
  background:linear-gradient(135deg, #2A2622, #3D3530);
  color:var(--paper);
  border-color:transparent;
  box-shadow:0 8px 20px rgba(36,31,26,.22);
}
.nav-btn.primary:hover:not(:disabled){
  background:linear-gradient(135deg, #C77B58, #E89A78);
  border-color:transparent;
  color:var(--paper);
  transform:translateY(-2px);
  box-shadow:0 14px 28px rgba(199,123,88,.4);
}

.free{
  margin-top:28px;
  padding-top:24px;
  border-top:1px solid var(--line);
}
.free-label{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.32em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:12px;
}
.free-label::before{
  content:'';
  width:20px;height:1px;
  background:var(--terracotta);
}
.free-input{
  width:100%;
  border:none;
  background:rgba(255,255,255,.5);
  border-radius:12px;
  font-family:var(--font-serif);
  font-size:15px;
  line-height:2;
  color:var(--ink);
  letter-spacing:.03em;
  resize:none;
  outline:none;
  min-height:88px;
  padding:12px 16px;
  border:1px solid var(--line);
  transition:all .5s var(--ease);
}
.free-input:focus{border-color:var(--terracotta);background:rgba(255,250,245,.9)}
.free-input::placeholder{color:var(--ink-4);font-style:italic}

.result{padding:0 4px}

.result-hero{text-align:center;margin-bottom:44px;position:relative}

.result-eyebrow{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.5em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:32px;
}

.animal-stage{
  position:relative;
  width:200px;height:200px;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.animal-stage::before{
  content:'';
  position:absolute;
  inset:-20px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(199,123,88,.18) 0%, rgba(255,200,180,.1) 40%, transparent 70%);
  animation:halo 3s var(--ease-soft) infinite;
}
.animal-stage::after{
  content:'';
  position:absolute;
  inset:20px;
  border-radius:50%;
  border:1px dashed rgba(199,123,88,.4);
  animation:spin 40s linear infinite;
}
@keyframes halo{
  0%,100%{transform:scale(1);opacity:.9}
  50%{transform:scale(1.25);opacity:.5}
}
@keyframes spin{to{transform:rotate(360deg)}}

.animal-svg{
  width:140px;height:140px;
  position:relative;
  z-index:2;
  animation:animalIn 1s var(--ease-out) both, breathe 4.5s var(--ease-soft) 1s infinite;
}
@keyframes animalIn{
  0%{opacity:0;transform:scale(.4) rotate(-8deg)}
  60%{opacity:1;transform:scale(1.12) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

.result-name{
  font-size:34px;
  font-weight:500;
  letter-spacing:.12em;
  color:var(--ink);
  margin-bottom:12px;
  animation:fadeUp .8s .3s var(--ease-out) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.result-mode{
  font-family:var(--font-hand);
  font-size:24px;
  color:var(--terracotta);
  letter-spacing:.06em;
  animation:fadeUp .8s .5s var(--ease-out) both;
}
.result-catch{
  font-size:14px;
  color:var(--ink-2);
  line-height:2;
  letter-spacing:.06em;
  font-style:italic;
  margin-top:24px;
  padding:0 28px;
  animation:fadeUp .8s .7s var(--ease-out) both;
}

.divider{
  height:1px;
  background:var(--line);
  margin:40px 0;
  position:relative;
}
.divider::before{
  content:'✳';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,254,251,.95);
  padding:0 16px;
  color:var(--terracotta);
  font-size:12px;
  opacity:.7;
}

.r-block{margin-bottom:36px}
.r-block-head{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:18px;
}
.r-block-en{
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.4em;
  color:var(--ink-3);
  text-transform:uppercase;
}
.r-block-cn{
  font-size:15px;
  font-weight:500;
  letter-spacing:.2em;
  color:var(--ink);
}
.r-block-line{
  flex:1;
  height:1px;
  background:var(--line);
}

.energy-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:16px;
}
.energy-num{
  font-family:var(--font-serif);
  font-size:56px;
  font-weight:300;
  letter-spacing:0;
  color:var(--ink);
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.energy-unit{
  font-family:var(--font-sans);
  font-size:11px;
  letter-spacing:.4em;
  color:var(--ink-3);
}
.energy-desc{
  font-family:var(--font-hand);
  font-size:18px;
  color:var(--terracotta);
  margin-left:auto;
  letter-spacing:.05em;
}
.energy-bar{
  height:1px;
  background:var(--line);
  position:relative;
  margin-top:8px;
}
.energy-fill{
  position:absolute;left:0;top:0;
  height:1px;
  background:linear-gradient(90deg, var(--terracotta), #FFB88C, var(--terracotta-deep), var(--terracotta));
  background-size:200% 100%;
  width:0;
  transition:width 1.6s var(--ease-out);
  animation:energyFlow 3s linear infinite;
}
.energy-fill::after{
  content:'';
  position:absolute;
  right:-3px;top:-3px;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--terracotta);
  box-shadow:0 0 0 4px rgba(199,123,88,.25), 0 0 12px rgba(199,123,88,.6);
}

.weather{
  display:flex;
  align-items:center;
  gap:22px;
}
.weather-icon{
  width:52px;height:52px;
  flex-shrink:0;
  animation:breathe 5s var(--ease-soft) infinite;
}
.weather-label{
  font-size:20px;
  letter-spacing:.14em;
  color:var(--ink);
}
.weather-desc{
  font-size:12px;
  color:var(--ink-3);
  letter-spacing:.1em;
  margin-top:4px;
}

.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{
  font-size:13px;
  letter-spacing:.12em;
  color:var(--ink-2);
  padding:7px 16px;
  border:1px solid var(--line);
  border-radius:100px;
  transition:all .45s var(--ease);
  background:rgba(255,255,255,.5);
}
.tag:hover{
  border-color:var(--terracotta);
  color:var(--terracotta);
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(199,123,88,.15);
}
.tag.soft{
  background:linear-gradient(135deg, var(--cream), #FFF4E8);
  border-color:transparent;
  color:var(--terracotta-deep);
}

.os{
  font-size:15px;
  line-height:2;
  letter-spacing:.06em;
  color:var(--ink-2);
  font-style:italic;
  padding:22px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-row{
  display:grid;
  grid-template-columns:66px 1fr;
  gap:20px;
  padding:12px 0;
  border-bottom:1px dashed var(--line);
  align-items:baseline;
}
.tl-row:last-child{border-bottom:none}
.tl-time{
  font-family:var(--font-sans);
  font-size:11px;
  letter-spacing:.15em;
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.tl-text{
  font-size:14px;
  color:var(--ink-2);
  letter-spacing:.05em;
  line-height:1.7;
}

.lucky{
  display:flex;
  align-items:center;
  gap:18px;
  padding:20px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.lucky-mark{
  width:36px;height:36px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:breathe 4s var(--ease-soft) infinite;
}
.lucky-label{
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.4em;
  color:var(--ink-3);
  text-transform:uppercase;
}
.lucky-value{
  font-size:16px;
  letter-spacing:.1em;
  color:var(--ink);
  margin-top:4px;
}

.encourage{
  font-size:15px;
  line-height:2.2;
  letter-spacing:.1em;
  color:var(--ink);
  text-align:center;
  padding:36px 24px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:40px 0;
  position:relative;
  background:linear-gradient(135deg, rgba(255,244,234,.4), rgba(255,250,245,.2));
  border-radius:16px;
}
.encourage::before{
  content:'✳';
  display:block;
  color:var(--terracotta);
  font-size:14px;
  margin-bottom:18px;
  opacity:.8;
}

.actions{display:flex;flex-direction:column;gap:14px;margin-top:8px;width:100%}
.action{
  font-family:var(--font-serif);
  font-size:14px;
  letter-spacing:.24em;
  font-weight:500;
  padding:18px 24px;
  border-radius:100px;
  cursor:pointer;
  transition:all .5s var(--ease);
  border:1px solid var(--ink);
  background:linear-gradient(135deg, #2A2622, #3D3530);
  color:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  position:relative;
  overflow:hidden;
  min-height:56px;
  line-height:1.3;
  width:100%;
  box-sizing:border-box;
  white-space:nowrap;
  box-shadow:0 8px 20px rgba(36,31,26,.15);
}
.action::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,200,180,.35), transparent);
  transform:translateX(-100%);
  transition:transform .8s var(--ease);
}
.action:hover::before{transform:translateX(100%)}
.action:hover{
  background:linear-gradient(135deg, #C77B58, #E89A78);
  border-color:transparent;
  transform:translateY(-2px);
  box-shadow:0 16px 36px rgba(199,123,88,.35);
}
.action:active{transform:translateY(0) scale(.99)}
.action.ghost{
  background:rgba(255,255,255,.55);
  color:var(--ink-2);
  border-color:rgba(200,190,180,.6);
  box-shadow:0 4px 12px rgba(0,0,0,.04);
}
.action.ghost:hover{
  background:linear-gradient(135deg, #FFF4EA, #FFE8D8);
  color:var(--ink);
  border-color:var(--terracotta);
  transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(199,123,88,.2);
}

.foot{
  text-align:center;
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.5em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-top:40px;
  opacity:.7;
}

.analyze{
  padding:100px 0;
  text-align:center;
  min-height:480px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.analyze-line{
  font-size:15px;
  letter-spacing:.25em;
  color:var(--ink-2);
  margin:14px 0;
  opacity:0;
  animation:fadeUp .9s var(--ease-out) forwards;
}
.analyze-line:nth-child(1){animation-delay:.1s}
.analyze-line:nth-child(2){animation-delay:1s}
.analyze-line:nth-child(3){animation-delay:1.9s}
.analyze-line:nth-child(4){animation-delay:2.8s}
.analyze-line:nth-child(5){
  animation-delay:3.7s;
  font-family:var(--font-hand);
  font-size:26px;
  color:var(--terracotta);
  letter-spacing:.05em;
  margin-top:24px;
}

/* ============ 底部导航（非悬浮、随内容滚动） ============ */
.tabbar{
  position:relative;
  margin:24px auto 0;
  width:100%;
  max-width:440px;
  background:rgba(255,254,251,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,240,230,.9);
  border-radius:100px;
  display:flex;
  padding:6px;
  z-index:30;
  box-shadow:0 12px 40px rgba(36,31,26,.12), 0 0 0 1px rgba(255,255,255,.5) inset;
  flex-shrink:0;
}
.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:10px 4px;
  border-radius:100px;
  border:none;
  background:transparent;
  cursor:pointer;
  transition:all .5s var(--ease);
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.2em;
  color:var(--ink-3);
}
.tab .tab-icon{
  width:16px;height:16px;
  opacity:.6;
  transition:all .5s var(--ease);
}
.tab.active{
  background:linear-gradient(135deg, #2A2622, #3D3530);
  color:var(--paper);
  box-shadow:0 4px 12px rgba(36,31,26,.25);
}
.tab.active .tab-icon{opacity:1;transform:scale(1.05)}

.modal{
  position:fixed;inset:0;
  background:rgba(36,31,26,.4);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  animation:fadeIn .4s var(--ease);
}
.modal.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:linear-gradient(135deg, #FFFEFB, #FFF8F2);
  border-radius:20px;
  padding:44px 36px;
  max-width:400px;
  width:100%;
  max-height:80vh;
  overflow-y:auto;
  animation:modalIn .55s var(--ease-out);
  box-shadow:0 30px 80px rgba(36,31,26,.3);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-card h3{
  font-size:20px;
  font-weight:500;
  letter-spacing:.12em;
  margin-bottom:22px;
  color:var(--ink);
}
.modal-card p{
  font-size:14px;
  color:var(--ink-2);
  line-height:2.1;
  letter-spacing:.04em;
  margin-bottom:14px;
}

.page-head{margin-bottom:40px;padding-top:4px}
.page-head-en{
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.5em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:14px;
}
.page-head-cn{
  font-size:28px;
  font-weight:500;
  letter-spacing:.16em;
  color:var(--ink);
}
.page-head-line{height:1px;background:var(--line);margin-top:24px}

.empty{
  text-align:center;
  padding:80px 20px;
  color:var(--ink-3);
  font-size:14px;
  letter-spacing:.15em;
  line-height:2.4;
}

.hist-item{
  padding:22px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:22px;
  align-items:center;
  transition:all .5s var(--ease);
  cursor:pointer;
}
.hist-item:hover{padding-left:10px;background:linear-gradient(90deg, rgba(255,240,230,.4), transparent 70%)}
.hist-item:last-child{border-bottom:none}
.hist-date{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.2em;
  color:var(--ink-3);
  min-width:76px;
}
.hist-body{flex:1}
.hist-name{
  font-size:17px;
  font-weight:500;
  letter-spacing:.1em;
  color:var(--ink);
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:14px;
}
.hist-name .hist-avatar{
  width:44px;height:44px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle, rgba(255,200,180,.35) 0%, rgba(255,240,230,.15) 60%, transparent 100%);
  border-radius:50%;
  animation:avatarFloat 4s ease-in-out infinite;
}
.hist-name .hist-avatar svg{width:38px;height:38px}
.hist-mode{
  font-family:var(--font-hand);
  font-size:16px;
  color:var(--terracotta);
  letter-spacing:.05em;
  margin-bottom:6px;
}
.hist-meta{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.15em;
  color:var(--ink-3);
}

.stat-card{
  padding:28px 0;
  border-bottom:1px solid var(--line);
}
.stat-card:last-child{border-bottom:none}
.stat-en{
  font-family:var(--font-sans);
  font-size:9px;
  letter-spacing:.4em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:16px;
}
.stat-val{
  font-size:30px;
  font-weight:400;
  letter-spacing:.08em;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:16px;
  line-height:1.2;
}
.stat-val small{
  font-size:13px;
  color:var(--ink-3);
  letter-spacing:.14em;
  font-weight:400;
}
.stat-val .stat-animal{
  position:relative;
  width:78px;height:78px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.stat-val .stat-animal::before{
  content:'';
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,200,180,.5) 0%, rgba(255,230,180,.25) 40%, transparent 70%);
  animation:haloSoft 3.5s ease-in-out infinite;
}
.stat-val .stat-animal svg{
  width:64px;height:64px;
  position:relative;
  z-index:1;
  animation:animalBob 4s ease-in-out infinite;
}

@keyframes avatarFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
@keyframes animalBob{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-5px) rotate(-1.5deg)}
}
@keyframes haloSoft{
  0%,100%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.15);opacity:.5}
}

/* ===== 图鉴 ===== */
.dex-filter{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.dex-filter-btn{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.15em;
  padding:6px 14px;
  border-radius:100px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.55);
  color:var(--ink-3);
  cursor:pointer;
  transition:all .4s var(--ease);
  text-transform:uppercase;
}
.dex-filter-btn:hover{border-color:var(--terracotta);color:var(--terracotta)}
.dex-filter-btn.active{
  background:linear-gradient(135deg, #2A2622, #3D3530);
  color:var(--paper);
  border-color:transparent;
  box-shadow:0 4px 10px rgba(36,31,26,.2);
}
.dex-progress{
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:.2em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-bottom:16px;
}
.dex-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.dex-cell{
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 6px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:all .55s var(--ease);
  position:relative;
  background:rgba(255,255,255,.4);
  overflow:hidden;
}
.dex-cell::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 40%, rgba(255,200,180,.45) 0%, transparent 65%);
  opacity:0;
  transition:opacity .5s var(--ease);
  pointer-events:none;
}
.dex-cell:hover::before{opacity:1}
.dex-cell:hover{transform:scale(1.03)}
.dex-cell:hover .dex-svg-wrap{transform:translateY(-4px) scale(1.08)}
.dex-svg-wrap{
  width:56px;height:56px;
  margin-bottom:6px;
  position:relative;
  z-index:1;
  transition:transform .55s var(--ease-spring);
  animation:animalBob 5s ease-in-out infinite;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dex-svg-wrap svg{width:100%;height:100%}
.dex-cell:nth-child(3n+1) .dex-svg-wrap{animation-delay:.2s}
.dex-cell:nth-child(3n+2) .dex-svg-wrap{animation-delay:1.2s}
.dex-cell:nth-child(3n) .dex-svg-wrap{animation-delay:2.2s}
.dex-cell.locked{opacity:.32}
.dex-cell.locked .dex-svg-wrap{filter:grayscale(1);animation:none}
.dex-cell.locked:hover .dex-svg-wrap{transform:none}
.dex-name{
  font-size:10px;
  letter-spacing:.08em;
  color:var(--ink-2);
  text-align:center;
  line-height:1.25;
  position:relative;
  z-index:1;
}
.dex-cell:hover .dex-name{color:var(--terracotta)}

#card-holder{position:fixed;left:-99999px;top:0}

@media (max-width:400px){
  body{padding:20px 14px 32px}
  .card{padding:22px 18px 26px;border-radius:20px}
  .hero-title{font-size:26px}
  .hero-title .hand{font-size:32px}
  .q-title{font-size:19px}
  .result-name{font-size:28px}
  .energy-num{font-size:48px}
  .brand{margin-bottom:32px}
  .hero-illus{max-width:220px;margin-bottom:28px}
  .animal-stage{width:170px;height:170px}
  .animal-svg{width:120px;height:120px}
  .action{font-size:13px;padding:16px 20px;letter-spacing:.2em}
  .nav-btn{font-size:10px;padding:10px 16px;letter-spacing:.18em}
  .stat-val .stat-animal{width:64px;height:64px}
  .stat-val .stat-animal svg{width:52px;height:52px}
}
</style>
</head>

  <div class="card" id="page-home">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" stroke="#C77B58" stroke-width="1.2"/>

          <path d="M150 48 L150 38 M150 56 L150 66 M140 52 L130 52 M160 52 L170 52"
                stroke="#C77B58" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="150" cy="52" r="3" fill="#C77B58" opacity=".5"/>
        </g>
        <path d="M50 100 Q58 96 60 104 Q54 106 50 100 Z" fill="#8A9A7B" opacity=".6"/>
        <path d="M255 115 Q261 112 263 118 Q258 120 255 115 Z" fill="#8A9A7B" opacity=".5"/>
        <path d="M62 145 Q68 143 69 147 Q65 149 62 145 Z" fill="#C77B58" opacity=".4"/>
        <path d="M240 145 Q244 143 246 146 Q243 148 240 145 Z" fill="#C77B58" opacity=".35"/>
      </svg>

      <div class="hero-eyebrow">TODAY'S LITTLE ANIMAL</div>
      <h1 class="hero-title">
        今天，你是<br>
        <span class="hand">什么小动物？</span>
      </h1>
      <p class="hero-sub">
        每天一分钟，记录今天的状态<br>
        慢慢认识自己
      </p>

      <div class="hero-actions">
        <button class="btn btn-primary" id="startBtn">开始记录今天</button>
        <button class="btn btn-ghost" id="viewLastBtn" style="display:none">查看今天的记录 →</button>
      </div>
    </div>
  </div>

  <div class="card" id="page-quiz" style="display:none">
    <div class="progress">
      <span class="progress-label">Progress</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-count" id="progressCount">01 / 10</span>
    </div>

    <div class="question" id="questionBox">
      <div class="q-meta">
        <span class="q-meta-num" id="qNum">No. 01</span>

      </div>

      <div class="opts" id="opts"></div>

      <div class="free" id="freeWrap" style="display:none">
        <div class="free-label">今天还做了什么</div>
        <textarea class="free-input" id="freeInput" placeholder="写一句今天发生的事，会参与动物匹配…" maxlength="200"></textarea>
      </div>

      <div class="nav">
        <button class="nav-btn" id="prevBtn">← 上一题</button>

const blush = (cx1, cx2, cy) => `

const smile = (x, y, w=8) => `

document.addEventListener('click', (e)=>{
  const target = e.target.closest('.action, .btn, .opt, .tab, .nav-btn, .dex-cell, .dex-filter-btn');
  if(!target) return;
  const rect = target.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#FFC8B4','#FFE6A0','#C8E6C8','#BED7F0','#E6C8E6','#C77B58'];
  for(let i=0;i<8;i++){
    const p = document.createElement('div');
    p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:8px;height:8px;border-radius:50%;background:${colors[Math.floor(Math.random()*colors.length)]};pointer-events:none;z-index:9999;box-shadow:0 0 8px rgba(255,255,255,.8);transition:transform .8s cubic-bezier(.16,1,.3,1), opacity .8s ease-out;`;
    document.body.appendChild(p);
    const angle = (Math.PI*2*i)/8 + Math.random()*.5;
    const dist = 40 + Math.random()*40;
    requestAnimationFrame(()=>{ p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(.2)`; p.style.opacity = '0'; });
    setTimeout(()=> p.remove(), 900);
  }
});

function showPage(name){
  ['home','quiz','result','analyze','history','stats','dex'].forEach(p=>{
    const el = $('#page-'+p);
    if(el){ if(p===name){ el.style.display=''; } else el.style.display='none'; }
  });
  const cur = $('#page-'+name);
  if(cur){ cur.style.animation='none'; void cur.offsetHeight; cur.style.animation=''; }
  const map = {home:'home', result:'result', history:'history', stats:'stats', dex:'dex'};
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === (map[name]||'home')));
}

$('#startBtn').addEventListener('click', ()=>{
  const key = todayKey();
  if(state.records[key]){
    showModal(`
      <h3>今天已经记录过啦</h3>
      <p>今天是 ${todayCN()}<br>你当时的小动物是：<br><b>${state.records[key].animalName} · ${state.records[key].mode}</b></p>
      <p>要重新记录今天的状态吗？</p>
      <div style="display:flex;gap:10px;margin-top:24px">
        <button class="action ghost" id="mView" style="flex:1;font-size:12px;padding:14px;letter-spacing:.15em">查看今天</button>
        <button class="action" id="mAgain" style="flex:1;font-size:12px;padding:14px;letter-spacing:.15em">重新测试</button>
      </div>
    `);
    $('#mView').onclick = ()=>{ closeModal(); state.currentRecord = state.records[key]; renderResult(state.currentRecord); showPage('result'); };
    $('#mAgain').onclick = ()=>{ closeModal(); startQuiz(); };

  }
  startQuiz();
});

$('#viewLastBtn').addEventListener('click', ()=>{
  const key = todayKey();
  if(state.records[key]){ state.currentRecord = state.records[key]; renderResult(state.currentRecord); showPage('result'); }
});

function startQuiz(){
  state.qIndex = 0;
  state.answers = QUESTIONS.map(q => q.multi ? [] : null);
  state.freeText = '';
  showPage('quiz');
  renderQuestion(false);
}

function renderQuestion(animate){
  const q = QUESTIONS[state.qIndex];
  const fill = () => {
    $('#qNum').textContent = 'No. ' + String(state.qIndex+1).padStart(2,'0');
    $('#qTitle').textContent = q.title;
    const pct = (state.qIndex / QUESTIONS.length) * 100;
    $('#progressFill').style.width = pct + '%';
    $('#progressCount').textContent = String(state.qIndex+1).padStart(2,'0') + ' / ' + String(QUESTIONS.length).padStart(2,'0');
    const box = $('#opts');
    box.innerHTML = '';
    const letters = ['A','B','C','D','E','F','G','H'];
    q.options.forEach((opt, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      const selected = q.multi ? (state.answers[state.qIndex]||[]).includes(idx) : state.answers[state.qIndex]===idx;
      if(selected) btn.classList.add('selected');
      btn.innerHTML = `<span class="opt-mark">${letters[idx]}</span><span class="opt-text">${opt.text}</span>`;
      btn.onclick = (e)=> onOptionClick(e, idx);
      box.appendChild(btn);
    });
    $('#freeWrap').style.display = (state.qIndex === QUESTIONS.length-1) ? '' : 'none';
    if(state.qIndex === QUESTIONS.length-1) $('#freeInput').value = state.freeText;
    if(q.multi){
      const cnt = (state.answers[state.qIndex]||[]).length;
      $('#qHint').textContent = cnt > 0 ? `已选 ${cnt} 项 · 可多选` : q.hint;
    } else {
      $('#qHint').textContent = q.hint;
    }
    $('#prevBtn').disabled = state.qIndex === 0;
    const nextBtn = $('#nextBtn');
    if(q.multi){
      nextBtn.style.visibility = 'visible';
      nextBtn.textContent = '下一题 →';
      nextBtn.className = 'nav-btn primary';
      nextBtn.onclick = gotoNext;
    } else {
      nextBtn.style.visibility = 'hidden';
      nextBtn.className = 'nav-btn';
    }
    $('#prevBtn').className = 'nav-btn';
  };
  const box = $('#questionBox');
  if(animate === false){ fill(); return; }
  box.classList.remove('q-anim-in');
  box.classList.add('q-anim-out');
  setTimeout(()=>{
    fill();
    box.classList.remove('q-anim-out');
    box.classList.add('q-anim-in');
    setTimeout(()=> box.classList.remove('q-anim-in'), 500);
  }, 240);
}

function onOptionClick(e, idx){
  const q = QUESTIONS[state.qIndex];
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(()=> ripple.remove(), 900);
  if(q.multi){
    const arr = state.answers[state.qIndex] || [];
    const i = arr.indexOf(idx);
    if(i>=0) arr.splice(i,1); else arr.push(idx);
    state.answers[state.qIndex] = arr;
    btn.classList.toggle('selected');
    const cnt = arr.length;
    $('#qHint').textContent = cnt > 0 ? `已选 ${cnt} 项 · 可多选` : q.hint;
  } else {
    state.answers[state.qIndex] = idx;
    $$('.opt').forEach((b,i)=> b.classList.toggle('selected', i===idx));
    if(state.qIndex === QUESTIONS.length-1) state.freeText = $('#freeInput').value.trim();
    setTimeout(gotoNext, 380);
  }
}

function gotoNext(){
  if(state.qIndex === QUESTIONS.length-1){
    state.freeText = $('#freeInput').value.trim();
    const missing = state.answers.findIndex(a => a===null || (Array.isArray(a)&&a.length===0));
    if(missing>=0){ state.qIndex = missing; renderQuestion(); return; }
    finishQuiz();
  } else {
    state.qIndex++;
    renderQuestion();
  }
}

$('#prevBtn').addEventListener('click', ()=>{
  if(state.qIndex>0){
    if(state.qIndex === QUESTIONS.length-1) state.freeText = $('#freeInput').value.trim();
    state.qIndex--; renderQuestion();
  }
});

function finishQuiz(){
  showPage('analyze');
  setTimeout(()=>{
    const rec = analyze();
    state.currentRecord = rec;
    state.records[todayKey()] = rec;
    saveRecords(state.records);
    renderResult(rec);
    showPage('result');
  }, 4600);
}

function analyze(){
  const tags = {};
  const addTag = (k,v)=>{ tags[k] = (tags[k]||0) + v; };
  QUESTIONS.forEach((q, qi)=>{
    const ans = state.answers[qi];
    if(q.multi){ (ans||[]).forEach(i=>{ const t = q.options[i].tags; for(const k in t) addTag(k, t[k]); }); }
    else if(ans!==null){ const t = q.options[ans].tags; for(const k in t) addTag(k, t[k]); }
  });
  const freeTags = {};
  const lower = (state.freeText||'').toLowerCase();
  for(const cat in KEYWORD_DICT){
    KEYWORD_DICT[cat].forEach(kw=>{ if(lower.includes(kw)){ addTag(cat, 3); freeTags[cat] = (freeTags[cat]||0)+1; } });
  }
  const map = [95,80,60,40,20];
  let energy = map[state.answers[7]] || 60;
  if(tags.lowEnergy) energy -= tags.lowEnergy * 2;
  if(tags.rest) energy += tags.rest;
  if(tags.exercise) energy += tags.exercise;
  energy = Math.max(5, Math.min(100, Math.round(energy)));
  let best = ANIMALS[0], bestScore = -Infinity;
  ANIMALS.forEach(a=>{
    let score = 0;
    for(const k in a.triggers) score += (tags[k]||0) * a.triggers[k];
    const [lo,hi] = a.energyRange;
    if(energy>=lo && energy<=hi) score += 8;
    else score -= Math.abs(energy - (lo+hi)/2) * 0.3;
    for(const k in freeTags) if(a.triggers[k]) score += freeTags[k] * 2;
    const d = new Date();
    const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    score += (((seed + a.id.length) % 7) - 3) * 0.5;
    if(score > bestScore){ bestScore = score; best = a; }
  });
  const modeIdx = Math.abs(energy + state.answers.join('').length) % best.modes.length;
  const mode = best.modes[modeIdx];
  const kws = best.keywords.map(k=>k);
  for(const cat in freeTags){
    const label = {coding:'代码',study:'学习',social:'社交',exercise:'运动',rest:'休息',video:'视频',create:'创作',night:'夜行',sad:'情绪',explore:'探索'}[cat];
    if(label && !kws.includes(label)) kws.push(label);
  }
  const finalKws = kws.slice(0,4);
  const weatherMap = ['sunny','cloudy','rain','storm','rainbow','moon'];
  const weatherDesc = {
    sunny:{l:'晴朗',d:'阳光很好，风也很轻'},
    cloudy:{l:'多云',d:'云层后面藏着一点小太阳'},
    rain:{l:'小雨',d:'适合窝着听雨声'},
    storm:{l:'雷阵雨',d:'情绪起伏，也是天气的一部分'},
    rainbow:{l:'彩虹',d:'今天有点特别'},
    moon:{l:'月光',d:'晚上才有感觉'}
  };
  const wKey = weatherMap[state.answers[8]] || 'cloudy';
  const weather = {key:wKey, ...weatherDesc[wKey]};
  const timeline = buildTimeline(tags);
  const encouragement = pickEncouragement(tags, energy, best);
  return {
    date: todayKey(), dateCN: todayCN(),
    animalId: best.id, animalName: best.name,
    mode: mode, energy: energy, weather: weather,
    keywords: finalKws, catchphrase: best.catchphrase, os: best.os,
    suitableActivities: best.activities, luckyItem: best.luckyItem,
    timeline: timeline, encouragement: encouragement, freeText: state.freeText
  };
}

function buildTimeline(tags){
  const rows = [];
  const push = (time,text)=> rows.push({time,text});
  if(tags.rest >= 5) push('09:00','睡到自然醒'); else push('07:30','起床');
  if(tags.study >= 4) push('09:30','学习 / 上课');
  if(tags.coding >= 4) push('10:30','写代码');
  if(tags.social >= 4) push('12:30','和朋友吃饭 / 聊天');
  if(tags.exercise >= 4) push('16:00','运动');
  if(tags.video >= 4 || tags.slack >= 4) push('19:00','刷手机 / 看视频');
  if(tags.explore >= 4) push('15:00','出门探索');
  if(tags.night >= 4) push('23:00','深夜活动');
  if(rows.length < 3){ push('12:00','午饭'); push('15:00','休息一下'); }
  push('23:30','测出今日小动物');
  rows.sort((a,b)=> a.time.localeCompare(b.time));
  return rows;
}

function pickEncouragement(tags, energy, animal){
  if(tags.study>=5 && energy<50) return '你今天已经很努力了，剩下的交给明天。';
  if(tags.slack>=5 && energy>65) return '今天虽然没完成计划，但你也收集了一些快乐。';
  if(tags.exercise>=5) return '今天动起来的样子，真的很棒。';
  if(tags.social>=5) return '今天和朋友在一起的时光，很珍贵。';
  if(tags.sad>=4) return '今天不用硬撑，允许自己休息一下。';
  if(energy<35) return '今天不用成为最努力的人，先把自己充满电。';
  if(energy>85) return '今天也要闪闪发光，但别忘了休息。';
  return animal.encouragement;
}

function weatherSVG(type){
  const ink = '#241F1A', c = '#C77B58';
  if(type==='sunny') return `<svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="7" stroke="${ink}" stroke-width="1.4"/><path d="M22 4v4M22 36v4M4 22h4M36 22h4M9 9l3 3M32 32l3 3M9 35l3-3M32 12l3-3" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  if(type==='cloudy') return `<svg viewBox="0 0 44 44" fill="none"><path d="M13 30h18a6 6 0 000-12 8 8 0 00-15-2 5 5 0 00-3 14z" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="30" cy="16" r="4" stroke="${c}" stroke-width="1.4"/></svg>`;
  if(type==='rain') return `<svg viewBox="0 0 44 44" fill="none"><path d="M13 26h18a6 6 0 000-12 8 8 0 00-15-2 5 5 0 00-3 14z" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/><path d="M16 32l-1 3M22 32l-1 3M28 32l-1 3" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  if(type==='storm') return `<svg viewBox="0 0 44 44" fill="none"><path d="M13 24h18a6 6 0 000-12 8 8 0 00-15-2 5 5 0 00-3 14z" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/><path d="M22 30l-3 6h5l-3 6" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(type==='rainbow') return `<svg viewBox="0 0 44 44" fill="none"><path d="M6 32a16 16 0 0132 0" stroke="${c}" stroke-width="1.6"/><path d="M11 32a11 11 0 0122 0" stroke="#8A9A7B" stroke-width="1.6"/><path d="M16 32a6 6 0 0112 0" stroke="${ink}" stroke-width="1.6"/></svg>`;
  if(type==='moon') return `<svg viewBox="0 0 44 44" fill="none"><path d="M30 22a12 12 0 11-12-12 10 10 0 0012 12z" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="32" cy="10" r="1.2" fill="${c}"/><circle cx="14" cy="30" r="1.2" fill="${c}"/></svg>`;
  return '';
}

        <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(199,123,88,.15),transparent 70%)"></div>
        <div style="position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(199,123,88,.35)"></div>
        <div style="width:260px;height:260px;position:relative;z-index:2">
          ${getAnimalSVG(rec.animalId).replace('viewBox="0 0 100 100"', 'viewBox="0 0 100 100" style="width:260px;height:260px"')}
        </div>
      </div>
      <div style="font-size:88px;font-weight:500;letter-spacing:.14em;text-align:center;line-height:1.2;margin-bottom:16px">${rec.animalName}</div>
      <div style="font-family:'Ma Shan Zheng',cursive;font-size:52px;color:#C77B58;letter-spacing:.05em;margin-bottom:36px">「${rec.mode}」</div>
      <div style="font-size:34px;font-style:italic;color:#5A524A;text-align:center;margin:20px 60px;line-height:1.8">— ${rec.catchphrase}</div>
      <div style="width:200px;height:1px;background:#E9E2D6;margin:40px 0"></div>
      <div style="font-size:64px;font-weight:300;letter-spacing:.02em;margin-bottom:8px">${rec.energy}<span style="font-size:22px;color:#9A9186;letter-spacing:.4em;margin-left:16px">% ENERGY</span></div>
      <div style="width:400px;height:2px;background:#E9E2D6;position:relative;margin-bottom:44px;border-radius:2px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;width:${rec.energy}%;height:2px;background:linear-gradient(90deg,#C77B58,#FFB88C,#A85F3E);border-radius:2px"></div>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:20px 0 44px 0">
        ${rec.keywords.map(k=>`<span style="font-size:24px;letter-spacing:.15em;color:#5A524A;padding:8px 22px;border:1px solid #E9E2D6;border-radius:100px;background:rgba(255,255,255,.6)">${k}</span>`).join('')}
      </div>
      <div style="font-size:28px;color:#5A524A;letter-spacing:.1em;margin-bottom:12px">今日幸运物 · ${rec.luckyItem}</div>
      <div style="font-size:28px;color:#241F1A;text-align:center;margin:36px 80px;line-height:2;letter-spacing:.08em;background:linear-gradient(135deg,rgba(255,244,234,.6),rgba(255,250,245,.3));padding:20px 30px;border-radius:16px">${rec.encouragement}</div>
      <div style="position:absolute;bottom:60px;font-family:'Zen Maru Gothic',sans-serif;font-size:16px;letter-spacing:.5em;color:#9A9186;text-transform:uppercase">Today's Little Animal · 3.0</div>
    </div>
  `;
  const card = document.getElementById('shareCard');
  html2canvas(card, { scale: 2.5, backgroundColor: '#FFFCF8', useCORS: true, logging: false, letterRendering: true, allowTaint: false, imageTimeout: 0, removeContainer: true }).then(canvas=>{
    const link = document.createElement('a');
    link.download = `今日小动物_${rec.animalName}_${rec.date}.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
    holder.innerHTML = '';
  }).catch(err=>{ console.error(err); alert('生成卡片失败，请重试'); holder.innerHTML = ''; });
}

function shareResult(rec){
  const text = `今天我是 ${rec.animalName} · ${rec.mode}\n「${rec.catchphrase}」\n能量 ${rec.energy}%\n来测测今天的你吧 →`;
  if(navigator.share){ navigator.share({title:'今日小动物 3.0', text, url: location.href}).catch(()=>{}); }
  else { navigator.clipboard.writeText(text + ' ' + location.href).then(()=>{ alert('已复制，去分享吧'); }).catch(()=> alert(text)); }
}

function renderHistory(){
  const recs = state.records;
  const keys = Object.keys(recs).sort().reverse();
  const box = $('#historyList');
  if(keys.length===0){ box.innerHTML = `<div class="empty">还没有记录<br>先去测一下今天吧</div>`; return; }
  box.innerHTML = keys.map(k=>{ const r = recs[k]; return `
    <div class="hist-item">
      <div class="hist-date">${r.dateCN}</div>
      <div class="hist-body">
        <div class="hist-name">
          <span class="hist-avatar">${getAnimalSVG(r.animalId)}</span>
          ${r.animalName}
        </div>
        <div class="hist-mode">${r.mode}</div>
        <div class="hist-meta">能量 ${r.energy}% · ${r.weather.l}</div>
      </div>
    </div>`; }).join('');
}

function renderStats(){
  const recs = state.records;
  const keys = Object.keys(recs).sort().reverse();
  const box = $('#statsBox');
  if(keys.length===0){ box.innerHTML = `<div class="empty">还没有数据<br>先记录几天吧</div>`; return; }
  const recent = keys.slice(0,7).map(k=>recs[k]);
  const avgEnergy = Math.round(recent.reduce((s,r)=>s+r.energy,0)/recent.length);
  const animalCount = {};
  keys.forEach(k=>{ const id = recs[k].animalId; animalCount[id] = (animalCount[id]||0)+1; });
  let topAnimalId = null, topCount = 0;
  for(const id in animalCount){ if(animalCount[id]>topCount){ topCount=animalCount[id]; topAnimalId=id; } }
  const topAnimal = ANIMALS.find(a=>a.id===topAnimalId);
  const weatherCount = {};
  keys.forEach(k=>{ const w = recs[k].weather.l; weatherCount[w]=(weatherCount[w]||0)+1; });
  let topWeather='', twc=0;
  for(const w in weatherCount){ if(weatherCount[w]>twc){twc=weatherCount[w]; topWeather=w;} }
  box.innerHTML = `
    <div class="stat-card">
      <div class="stat-en">Recent 7 Days Energy</div>
      <div class="stat-val">${avgEnergy}<small>% 平均能量</small></div>
    </div>
    <div class="stat-card">
      <div class="stat-en">Most Frequent Animal</div>
      <div class="stat-val">
        ${topAnimal?`
          <span class="stat-animal">${getAnimalSVG(topAnimal.id)}</span>
          <span>${topAnimal.name}</span>
          <small style="margin-left:auto">出现 ${topCount} 次</small>
        `:'<small>还没有数据</small>'}
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-en">Most Frequent Mood</div>
      <div class="stat-val">${topWeather||'—'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-en">Total Days</div>
      <div class="stat-val">${keys.length}<small>天记录</small></div>
    </div>
  `;
}

/* ===== 图鉴 ===== */
function renderDexFilter(){
  const cats = ['全部', ...new Set(ANIMALS.map(a=>a.category))];
  const box = $('#dexFilter');
  box.innerHTML = cats.map(c=>`<button class="dex-filter-btn ${state.dexFilter===c?'active':''}" data-cat="${c}">${c}</button>`).join('');
  box.querySelectorAll('.dex-filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      state.dexFilter = btn.dataset.cat;
      renderDex();
    };
  });
}

function renderDex(){
  renderDexFilter();
  const owned = {};
  Object.values(state.records).forEach(r=>{ owned[r.animalId] = (owned[r.animalId]||0)+1; });
  const ownedCount = Object.keys(owned).length;
  $('#dexProgress').textContent = `已收集 ${ownedCount} / ${ANIMALS.length}`;

  const list = state.dexFilter === '全部'
    ? ANIMALS
    : ANIMALS.filter(a=> a.category === state.dexFilter);

  const grid = $('#dexGrid');
  grid.innerHTML = list.map(a=>{
    const o = owned[a.id]||0;
    return `<div class="dex-cell ${o?'':'locked'}" data-id="${a.id}">
      <div class="dex-svg-wrap">${getAnimalSVG(a.id)}</div>
      <div class="dex-name">${o?a.name:'未知'}</div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.dex-cell').forEach(cell=>{
    cell.onclick = ()=>{
      const a = ANIMALS.find(x=>x.id===cell.dataset.id);
      if(!a) return;
      const o = owned[a.id]||0;
      showModal(`
        <div style="text-align:center;margin-bottom:20px;">
          <div style="width:100px;height:100px;margin:0 auto 12px;animation:animalBob 4s ease-in-out infinite;">
            ${getAnimalSVG(a.id)}
          </div>
        </div>
        <h3 style="text-align:center;">${a.name}</h3>
        <p style="font-family:'Zen Maru Gothic',sans-serif;font-size:10px;letter-spacing:.4em;color:#9A9186;text-transform:uppercase;margin-bottom:16px;text-align:center;">${a.category}</p>
        <p><b>性格 · </b>${a.personality}</p>
        <p><b>口头禅 · </b>「${a.catchphrase}」</p>
        <p><b>出现 · </b>${o} 次</p>
        <button class="action" style="width:100%;margin-top:24px;font-size:13px;padding:14px;letter-spacing:.2em" onclick="closeModal()">知道了</button>
      `);
    };
  });
}

function showModal(html){ $('#modalCard').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

$$('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const t = tab.dataset.tab;
    if(t==='home') showPage('home');
    else if(t==='result'){
      if(state.currentRecord){ renderResult(state.currentRecord); showPage('result'); }
      else if(state.records[todayKey()]){ state.currentRecord = state.records[todayKey()]; renderResult(state.currentRecord); showPage('result'); }
      else { showModal(`<h3>今天还没有记录</h3><p>先去测一下今天的小动物吧</p><button class="action" style="width:100%;margin-top:20px" onclick="closeModal();showPage('home')">好</button>`); }
    }
    else if(t==='history'){ renderHistory(); showPage('history'); }
    else if(t==='stats'){ renderStats(); showPage('stats'); }
    else if(t==='dex'){ renderDex(); showPage('dex'); }
  });
});

(function boot(){
  const today = state.records[todayKey()];
  if(today){ $('#startBtn').textContent = '重新记录今天'; $('#viewLastBtn').style.display = ''; }
  showPage('home');
})();
</script>
</body>
</html>
